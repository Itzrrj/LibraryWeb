<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin · Indus Valley Library</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    Demo mode: Supabase is not connected yet, so changes are saved only in this browser. See README.md to connect it.
  </div>

  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="../assets/favicon.svg" alt="" width="56" height="56" />
      <h1>Admin login</h1>
      <p class="muted">Indus Valley Library website</p>
      <label>Email<input type="email" name="email" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button class="btn" type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
      <a href="../" class="muted small">← Back to website</a>
    </form>
  </main>

  <!-- Editor -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="side-brand">
        <img src="../assets/favicon.svg" alt="" width="36" height="36" />
        <div><strong>Admin panel</strong><small id="who"></small></div>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div class="side-foot">
        <a class="btn btn-ghost btn-block" href="../" target="_blank" rel="noopener">View website ↗</a>
        <button id="logout" class="btn btn-ghost btn-block" type="button">Log out</button>
      </div>
    </aside>
    <section class="main">
      <header class="topbar">
        <button id="menu-btn" class="menu-btn" type="button" aria-label="Sections">☰</button>
        <h1 id="panel-title"></h1>
        <span id="save-state" class="save-state"></span>
        <button id="save-btn" class="btn" type="button" disabled>Save changes</button>
      </header>
      <div id="panel" class="panel"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
